name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Browsers and their system libraries come baked into Playwright's image, so the job never
    # waits on apt mirrors (a slow mirror once ate the whole time budget). Keep the tag in step
    # with @playwright/test; the first step fails if they drift.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright matches the image
        run: test "$(node -p "require('@playwright/test/package.json').version")" = "1.64.1"
      # Typecheck, unit tests, design-system audit, production build, and the behavior tests in
      # Chromium and WebKit.
      - run: npm run check
      - name: Visual regression
        # Screenshots of every docs example and overlay state, and the agent app's main states,
        # against the baselines in apps/*/tests-visual/screenshots. The "Update screenshots"
        # workflow refreshes them.
        run: npm run test:visual -w apps/docs && npm run test:visual -w apps/agent
      - name: Behavior tests in Firefox
        # The container runs as root, and Firefox refuses to start when $HOME belongs to someone
        # else (GitHub mounts it for the image's pwuser).
        env:
          HOME: /root
        run: npm run test:e2e:firefox -w apps/docs && npm run test:e2e:firefox -w apps/agent
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: |
            apps/docs/test-results
            apps/agent/test-results
          retention-days: 7
