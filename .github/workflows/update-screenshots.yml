name: Update screenshots

# Renders the visual-regression baselines in the same image the check job compares them in, and
# uploads them. Download the artifact into apps/docs/tests-visual/screenshots, look at the diff,
# and commit it.
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/docs
      - run: npm run test:visual -w apps/docs -- --update-snapshots=all
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: apps/docs/tests-visual/screenshots
          retention-days: 7
